<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日 AI 日报</title>
<style>
:root { color-scheme: light dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1ea; color: #1f2933; }
main { width: min(520px, calc(100% - 40px)); padding: 38px; border-radius: 22px; background: #fff; box-shadow: 0 18px 50px rgba(40, 45, 50, .13); }
h1 { margin: 0 0 18px; font-size: 28px; }
p { line-height: 1.8; margin: 10px 0; }
a { display: inline-block; margin-top: 18px; padding: 10px 16px; border-radius: 10px; background: #1f2933; color: #fff; text-decoration: none; }
@media (prefers-color-scheme: dark) { body { background: #171a1f; color: #edf1f5; } main { background: #232830; } a { background: #edf1f5; color: #171a1f; } }
</style>
</head>
<body>
<main>
  <h1>今日 AI 日报</h1>
  <p id="message">正在检查今天的日报……</p>
  <div id="actions"></div>
</main>
<script>
(function () {
  var message = document.getElementById("message");
  var actions = document.getElementById("actions");

  function shanghaiDate() {
    var parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Shanghai",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());
    var values = {};
    parts.forEach(function (part) { values[part.type] = part.value; });
    return values.year + "-" + values.month + "-" + values.day;
  }

  function addLink(text, href) {
    var link = document.createElement("a");
    link.textContent = text;
    link.href = href;
    actions.appendChild(link);
  }

  fetch("latest.json?ts=" + Date.now(), { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(function (latest) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(latest.date || "") ||
          !/^\d{4}-\d{2}-\d{2}\.html$/.test(latest.html || "")) {
        throw new Error("invalid latest metadata");
      }
      if (latest.date === shanghaiDate()) {
        window.location.replace(latest.html + "?from=today");
        return;
      }
      message.textContent = "今天的日报还没有生成。最新一期是 " + latest.date + "。";
      addLink("打开最新一期", latest.html);
    })
    .catch(function () {
      message.textContent = "暂时无法连接云端日报。请检查网络后再试一次。";
    });
})();
</script>
</body>
</html>
