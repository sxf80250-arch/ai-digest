<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="kicker">AI 项目日报</div>
    <h1>{{HEADING}}</h1>
    <p class="lead">{{LEAD}}</p>
    <nav class="topnav" aria-label="期号导航">
      <a class="pill" href="{{HOME}}">目录</a>
      <a class="pill {{PREV_CLASS}}" href="{{PREV_HREF}}">上一期 <span class="mono">{{PREV_DATE}}</span></a>
      <a class="pill {{NEXT_CLASS}}" href="{{NEXT_HREF}}">下一期 <span class="mono">{{NEXT_DATE}}</span></a>
    </nav>
  </div>
</header>
<main class="wrap">
{{CONTENT}}
</main>
<footer class="wrap foot">
  <p>数据来自 GitHub 官方接口 · 每期按星标平均增速排序 · 每天 08:00 自动生成</p>
</footer>
</body>
</html>
